[theme]
# Cosy farmhouse palette — cream background, sage primary, soft charcoal text.
# Mirrors the HouseData dashboard so the two feel like a set.
base = "light"
primaryColor = "#7B9B7E"               # sage (buttons, sliders, active state)
backgroundColor = "#F7F4EE"             # warm cream (main area)
secondaryBackgroundColor = "#EEE9DF"    # sandstone (sidebar, metric cards)
textColor = "#2F3640"                   # soft charcoal, not pure black
font = "sans serif"
